name: Backend CI

# CI-01 — Backend-wide upstream gate (lint -> type -> unit -> integration).
# Ragas eval lives in its own workflow (.github/workflows/ragas.yml) and runs in
# parallel on the same path triggers; this workflow is the lint/type/test gate.
#
# Path-gated (L-09): only fires on backend/** + this workflow file. Frontend-only
# PRs skip entirely (frontend-ci.yml is the gate for those).
#
# Concurrency cancel-in-progress: superseded commits drop so runner-minutes stay
# inside the GitHub Actions free tier (2000 min/mo for public repos).
#
# This workflow does NOT touch GCP — no WIF block, no deploy steps. Those live in
# build-push.yml (on merge to main) and deploy-prod.yml (on release tag).

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-type:
    name: Ruff lint + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv (Python 3.12)
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Sync backend deps (dev group)
        working-directory: backend
        run: uv sync --group dev

      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .

      - name: Mypy
        working-directory: backend
        run: uv run mypy app api agent celery_app

  unit:
    name: Pytest unit (quick suite)
    runs-on: ubuntu-latest
    needs: [lint-and-type]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv (Python 3.12)
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Sync backend deps (dev group)
        working-directory: backend
        run: uv sync --group dev

      - name: Pytest unit
        working-directory: backend
        run: uv run pytest -x -m "not slow and not integration" -q

  integration:
    name: Pytest integration (docker-compose services)
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv (Python 3.12)
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Sync backend deps (dev group)
        working-directory: backend
        run: uv sync --group dev

      - name: Bring up docker-compose (db + redis + qdrant + api + worker + beat)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Pass runner env into compose containers via root .env file.
          {
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
          } > .env
          docker compose up -d
          echo "Compose started; waiting for /healthz..."

      - name: Poll /healthz until ready (max 90s)
        run: |
          for i in $(seq 1 45); do
            if curl --silent --fail --max-time 2 http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "Backend ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "Backend not ready within 90s"
          curl -sv http://localhost:8000/healthz || true
          docker compose logs --tail=400 || true
          exit 1

      - name: Pytest integration
        working-directory: backend
        run: uv run pytest -m "integration" -q

      - name: Tear down compose
        if: always()
        run: docker compose down -v
