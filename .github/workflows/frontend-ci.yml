name: Frontend CI

# Phase 6 reminder: the `lighthouse` job below requires the VERCEL_TOKEN repo
# secret to resolve the Vercel preview URL. Set it via:
#   gh secret set VERCEL_TOKEN
# Then push any PR to verify the Lighthouse step runs against the live Vercel
# preview deployment. Tracked under DOC-03 / CI-04; full activation lands in the
# 06-07 pre-launch checklist (not in 06-06 — workflows are defined but not run
# until the user provisions the GitHub repo + GCP project + Vercel secret).

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  lint-and-test:
    name: Lint + typecheck + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc

      - name: Vitest (unit + drift; drift skips when BACKEND_LIVE unset)
        run: pnpm vitest run

  playwright:
    name: Playwright (Chromium + WebKit, mobile + desktop)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: pnpm playwright

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI on Vercel preview
    runs-on: ubuntu-latest
    needs: playwright
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Wait for Vercel GitHub app to post the preview URL on the PR, then
      # rewrite lighthouserc.json's URL to the live preview, pre-warm with curl
      # (Q2 cold-start mitigation), and run lhci.
      # Requires the Vercel GitHub app to be installed for the repo (it is — the
      # Plan 04-02 Vercel-link checkpoint provisioned this).
      - name: Resolve Vercel preview URL
        id: vercel
        uses: zentered/vercel-preview-url@v1.1.9
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel_team_id: team_375uvHfwjEACwrYgFIO5vvRr
          vercel_project_id: prj_ybfjrTmiyh5tRthK89thAtaOUnLX

      - name: Pre-warm preview (Q2 cold-start absorption)
        if: steps.vercel.outputs.preview_url_with_protocol != ''
        run: |
          curl --silent --max-time 30 "${{ steps.vercel.outputs.preview_url_with_protocol }}/map" || true
          sleep 10

      - name: Lighthouse CI
        if: steps.vercel.outputs.preview_url_with_protocol != ''
        env:
          PREVIEW_URL: ${{ steps.vercel.outputs.preview_url_with_protocol }}
        run: |
          # Patch lighthouserc.json's URL with the live preview.
          tmp=$(mktemp)
          jq --arg u "$PREVIEW_URL/map" '.ci.collect.url = [$u]' lighthouserc.json > "$tmp"
          mv "$tmp" lighthouserc.json
          pnpm lhci
