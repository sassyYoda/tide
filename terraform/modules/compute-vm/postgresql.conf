# PostgreSQL 17 / TimescaleDB tuning overlay for tide-vm (e2-micro, 1 GB RAM).
# RESEARCH §Q1 lines 162-174 — conservative values so the db container stays
# inside its 450 MB mem_limit (Pitfall P1). swappiness=10 + 4 GB swap absorb
# transient spikes during pg_dump or hypertable compression.

shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 256MB
max_connections = 25
wal_compression = on
synchronous_commit = off
timescaledb.max_background_workers = 2
listen_addresses = '*'
shared_preload_libraries = 'timescaledb'
