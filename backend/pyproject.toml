[project]
name = "tide-backend"
version = "0.1.0"
description = "Tide environmental data ingest + conditions API"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "asyncpg>=0.30,<0.31",
    "celery[redis]==5.6.3",
    "ephem>=4.1,<5",
    "fastapi==0.128.0",
    "google-cloud-storage>=2,<3",
    "httpx>=0.27,<0.28",
    "orjson>=3.10,<4",
    "prometheus-client>=0.21,<0.22",
    "psycopg2-binary>=2.9,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "redis>=5,<6",
    "sqlalchemy[asyncio]==2.0.49",
    "greenlet>=3.1,<4",
    "structlog>=24,<25",
    "tenacity>=9,<10",
    "uvicorn[standard]>=0.34,<0.35",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "freezegun>=1.5,<2",
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<0.25",
    "respx>=0.21,<0.22",
    "ruff>=0.15.11",
    "testcontainers[postgres,redis]>=4,<5",
]
