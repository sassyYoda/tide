[project]
name = "tide-backend"
version = "0.1.0"
description = "Tide environmental data ingest + conditions API"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "asyncpg>=0.30,<0.31",
    "celery[redis]==5.6.3",
    "ephem>=4.1,<5",
    "fastapi==0.128.0",
    "google-cloud-storage>=2,<3",
    "httpx>=0.27,<0.28",
    "orjson>=3.10,<4",
    "prometheus-client>=0.21,<0.22",
    "psycopg2-binary>=2.9,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "redis>=5,<6",
    "sqlalchemy[asyncio]==2.0.49",
    "greenlet>=3.1,<4",
    "structlog>=24,<25",
    "tenacity>=9,<10",
    "uvicorn[standard]>=0.34,<0.35",
    # Phase 2 — ML track
    "xgboost==3.2.0",
    "shap==0.51.0",
    "scikit-learn>=1.6,<2",
    "optuna>=4,<5",
    "mlflow==3.11.1",
    "lightgbm>=4.5,<5",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    # Phase 2 — RAG track
    "qdrant-client==1.17.1",
    "fastembed>=0.8,<0.9",
    "openai>=1.50,<2",
    "langchain-text-splitters>=0.3,<0.4",
    "tiktoken>=0.8,<0.9",
    # Phase 2 — ingest / scrape / extract
    "asyncpraw>=7.8,<8",
    "selectolax>=0.3,<0.4",
    "instructor>=1,<2",
    "spacy>=3.8,<4",
    # Phase 3 — LangGraph agent + FastAPI SSE
    "langgraph==1.1.8",
    "langchain>=1.0,<2",
    "langchain-openai>=0.3,<0.4",
    "langchain-anthropic>=0.3,<0.4",
    "anthropic>=0.40,<1",
    "langfuse==4.3.1",
    "sse-starlette==3.3.4",
    "rapidfuzz>=3.10,<4",
    "slowapi>=0.1.9,<0.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires Docker testcontainers (Timescale/Redis/Qdrant)",
    "slow: long-running tests (training, benchmarks) — skipped in quick suite",
]

[dependency-groups]
dev = [
    "freezegun>=1.5,<2",
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<0.25",
    "ragas==0.4.3",
    "respx>=0.21,<0.22",
    "ruff>=0.15.11",
    "testcontainers[postgres,redis]>=4,<5",
]
