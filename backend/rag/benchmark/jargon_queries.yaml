# NJ saltwater jargon-heavy retrieval benchmark.
#
# STATUS: DRAFT AT CHECKPOINT. Queries are LLM-drafted shape-correct skeletons
# tagged for human curation. The expected_report_ids must be filled in by the
# user re-reading data/structured_reports/corpus.jsonl (the report's line index
# in the JSONL file is the report_id used at seed time).
#
# How to fill expected_report_ids at the checkpoint:
#   1. Open the corpus: ``jq -r '.raw.body' data/structured_reports/corpus.jsonl
#      | head -n 20`` (or use a JSONL viewer)
#   2. For each query, identify ≥1 corpus line index whose body matches the
#      query's intent (the right species + location + jargon). Multiple is
#      fine — recall@5 is "any expected id appears in top 5".
#   3. Replace the placeholder ``[]`` with the chosen ids.
#   4. Run ``cd backend && uv run python -m scripts.retrieval_benchmark`` to
#      measure recall. Adjust queries (not ids) if the gate fails.
#
# Each case must end with a non-empty expected_report_ids list before
# retrieval_benchmark can score it. The benchmark schema test in
# tests/rag/test_retrieval_benchmark.py asserts this once the file is committed.

version: 1
status: draft-pending-curation
notes: |
  20 cases. Mix of jargon-heavy (BM25 should win) and semantic
  (dense should win) so RRF fusion is exercised across both ends.

